# Visit our schema definition for additional information on this file format.
# https://github.com/newrelic/open-install-library/blob/main/docs/recipe-spec/recipe-spec.md#schema-definition

name: nrdot-collector-ebpf-host
displayName: NRDOT Collector - eBPF Infra Host
description: Installs the NRDOT OpenTelemetry Collector alongside the New Relic eBPF agent for host + process metrics + OHI support. Runs a curated eBPF-infra config (no file_log). Pulled in automatically as a dependency of ebpf-agent-installer.
repository: https://github.com/newrelic/nrdot-collector-releases

dependencies:
  - ebpf-agent-installer

installTargets:
  - type: host
    os: linux
    platformFamily: debian
    platformVersion: "(10|11|12)\\.*"
  - type: host
    os: linux
    platform: ubuntu
    platformVersion: "(18|20|22|24|26)\\.04"

keywords:
  - NRDOT
  - OpenTelemetry
  - OTel
  - Collector
  - Host
  - Infrastructure
  - eBPF
  - Debian
  - Ubuntu

processMatch: []

validationNrql: "SELECT count(*) FROM Metric WHERE metricName LIKE 'system.%' SINCE 10 minutes ago"

preInstall:
  discoveryMode:
    - targeted

install:
  version: "3"
  silent: true

  vars:
    IS_SYSTEMCTL:
      sh: command -v systemctl | wc -l

  tasks:
    default:
      cmds:
        - task: assert_pre_req
        - task: install_collector
        - task: write_ebpf_config
        - task: configure_env
        - task: ensure_ebpf_config
        - task: start_collector
        - task: assert_collector_status_ok

    assert_pre_req:
      cmds:
        - |
          if [ "$(id -u)" != "0" ]; then
            echo "This newrelic install must be run under sudo or root" >&2
            exit 3
          fi
        - |
          if ! command -v curl > /dev/null 2>&1; then
            echo "curl is required to run the newrelic install. Please install curl and re-run the installation." >&2
            exit 16
          fi
        - |
          if [ "{{.IS_SYSTEMCTL}}" -eq 0 ]; then
            echo "systemd is required for the nrdot-collector service configuration." >&2
            exit 131
          fi

    install_collector:
      cmds:
        - |
          COLLECTOR_DISTRO="nrdot-collector"

          COLLECTOR_VERSION=$(curl -s https://api.github.com/repos/newrelic/nrdot-collector-releases/releases/latest \
            | grep '"tag_name"' \
            | sed -E 's/.*"tag_name": "([^"]+)".*/\1/')

          if [ -z "$COLLECTOR_VERSION" ]; then
            echo "Failed to fetch the latest release version from GitHub. Please check your internet connection." >&2
            exit 1
          fi

          if dpkg -l | grep -q "^ii.*nrdot-collector "; then
            INSTALLED_VERSION=$(dpkg -l nrdot-collector | awk '/^ii/{print $3}' | sed 's/^[0-9]*://')
            if [ "$INSTALLED_VERSION" = "$COLLECTOR_VERSION" ]; then
              echo "nrdot-collector ${COLLECTOR_VERSION} is already installed. Skipping download."
              exit 0
            else
              echo "Upgrading nrdot-collector from ${INSTALLED_VERSION} to ${COLLECTOR_VERSION}"
            fi
          else
            echo "Installing ${COLLECTOR_DISTRO} version: ${COLLECTOR_VERSION}"
          fi

          ARCH="amd64"
          IS_ARM=$(uname -m | grep -i 'aarch64' | wc -l)
          if [ $IS_ARM -gt 0 ]; then
            ARCH="arm64"
          fi

          DOWNLOAD_URL="https://github.com/newrelic/nrdot-collector-releases/releases/download/${COLLECTOR_VERSION}/${COLLECTOR_DISTRO}_${COLLECTOR_VERSION}_linux_${ARCH}.deb"
          echo "Downloading from: ${DOWNLOAD_URL}"

          curl -L --output /tmp/nrdot-collector.deb "$DOWNLOAD_URL"
          if [ $? -ne 0 ]; then
            echo "Failed to download the nrdot-collector package." >&2
            exit 1
          fi

          DEBIAN_FRONTEND=noninteractive dpkg -i /tmp/nrdot-collector.deb
          if [ $? -ne 0 ]; then
            echo "dpkg install failed, attempting to fix broken dependencies..." >&2
            apt-get install -f -y
            if [ $? -ne 0 ]; then
              echo "Failed to install the nrdot-collector package." >&2
              exit 1
            fi
          fi

          rm -f /tmp/nrdot-collector.deb
          echo "${COLLECTOR_DISTRO} installed successfully."
      silent: true

    # Write the eBPF-infra base config (host + process metrics, no file_log)
    # create-if-missing so customer hand-edits survive re-runs. This is the
    # per-distro config source (there is no cross-recipe config-sharing
    # mechanism in open-install-library; the eBPF agent recipes write config
    # inline the same way).
    write_ebpf_config:
      cmds:
        - |
          EBPF_CONFIG="/etc/nrdot-collector/ebpf-infra-config.yaml"
          mkdir -p /etc/nrdot-collector

          if [ -f "$EBPF_CONFIG" ]; then
            echo "${EBPF_CONFIG} already exists. Leaving customer config untouched."
            exit 0
          fi

          cat > "$EBPF_CONFIG" <<'YAML'
          # NRDOT collector base config for eBPF infra mode (host + process metrics).
          # Trimmed from the stock nrdot host config: file_log and otlp receiver removed
          # (host logs are out of scope; the eBPF agent exports directly to New Relic).
          # Every credential/endpoint is an ${env:...} ref resolved from
          # nrdot-collector.conf at runtime.
          extensions:
            health_check:

          receivers:
            host_metrics:
              collection_interval: 60s
              scrapers:
                cpu:
                  metrics:
                    system.cpu.logical.count:
                      enabled: false
                    system.cpu.time:
                      enabled: false
                    system.cpu.utilization:
                      enabled: true
                load:
                # used = MemTotal - MemAvailable (feature gate receiver.hostmetricsreceiver.UseLinuxMemAvailable,
                # on by default), as OTel semconv defines it: "On Linux, this corresponds to "MemTotal -
                # MemAvailable" from /proc/meminfo, which more accurately reflects memory in active use by
                # applications compared to older formulas based on free, cached, and buffers."
                # (https://opentelemetry.io/docs/specs/semconv/system/system-metrics/#metric-systemmemoryusage).
                # The infrastructure agent's default (ignore_reclaimable: false) is the same.
                memory:
                  metrics:
                    system.memory.utilization:
                      enabled: true
                paging:
                  metrics:
                    system.paging.utilization:
                      enabled: false
                    system.paging.faults:
                      enabled: false
                # The infrastructure agent's supported filesystems (storage_sampler_linux.go
                # SupportedFileSystems); vfat (/boot/efi), tmpfs, overlay and squashfs are
                # not reported.
                filesystem:
                  include_fs_types:
                    fs_types: [xfs, btrfs, ext, ext2, ext3, ext4, hfs, vxfs, zfs, reiserfs]
                    match_type: strict
                  metrics:
                    system.filesystem.utilization:
                      enabled: true
                # Whole disks only. /proc/diskstats also lists partitions and dm/md devices,
                # whose I/O is already counted on the disk underneath, so summing across
                # devices would double-count.
                disk:
                  include:
                    devices: ["^(sd[a-z]+|xvd[a-z]+|vd[a-z]+|hd[a-z]+|nvme[0-9]+n[0-9]+)$"]
                    match_type: regexp
                  metrics:
                    system.disk.merged:
                      enabled: false
                    system.disk.pending_operations:
                      enabled: false
                    system.disk.weighted_io_time:
                      enabled: false
                # The infrastructure agent's default network_interface_filters
                # (config_linux.go): case-insensitive prefix dummy, lo, vmnet, sit, tun, tap,
                # veth, or tun/tap at index 1.
                network:
                  exclude:
                    interfaces: ["(?i)^(dummy|lo|vmnet|sit|tun|tap|veth|.tun|.tap)"]
                    match_type: regexp
                  metrics:
                    system.network.connections:
                      enabled: false
                processes:
                # Per-process metrics that need no privilege (/proc/<pid>/stat, statm,
                # status). Disk I/O and FD counts need CAP_SYS_PTRACE / CAP_DAC_READ_SEARCH
                # for other users' processes, so the eBPF agent reports those instead.
                # process.cpu.utilization follows OTel semconv: "Difference in process.cpu.time since the
                # last measurement, divided by the elapsed time and number of CPUs available to the process."
                # (https://opentelemetry.io/docs/specs/semconv/system/process-metrics/#metric-processcpuutilization).
                # So a process busy on 2 cores of a 16-CPU host reads 0.125, and per-process values add up to
                # host CPU utilization. The infrastructure agent's ProcessSample.cpuPercent is not divided by
                # the CPU count (the same process reads 200%).
                # Processes are sampled once per collection interval. A process needs two samples to get a
                # cpu.utilization value, so one that lives shorter than the interval is not attributed (its
                # CPU still shows in system.cpu.utilization). The infrastructure agent has the same limit at
                # its 20s metrics_process_sample_rate.
                process:
                  metrics:
                    process.cpu.utilization:
                      enabled: true
                    process.cpu.time:
                      enabled: false
                    process.threads:
                      enabled: true
                    # Attribute renamed to system.paging.fault.type by transform/host_paging_fault_type.
                    process.paging.faults:
                      enabled: true
                    process.disk.io:
                      enabled: false
                  # Scraper default; no New Relic UI reads it, and it needs CAP_SYS_PTRACE.
                  resource_attributes:
                    process.executable.path:
                      enabled: false
                    # Full argv can carry secrets. OTel semconv marks process.command_line Opt-In: "SHOULD NOT
                    # be collected by default unless there is sanitization that excludes sensitive data."
                    # (https://opentelemetry.io/docs/specs/semconv/resource/process/). The infrastructure agent
                    # also strips arguments by default (strip_command_line: true). process.command (argv[0])
                    # is kept; no New Relic UI reads process.command_line.
                    process.command_line:
                      enabled: false
                  # Kernel threads and processes exiting mid-scrape would log errors every scrape.
                  mute_process_all_errors: true

          processors:
            metrics_transform:
              transforms:
                # One host-wide value per state, grouped as the infrastructure agent does
                # (cpu.go): user = user + nice, system = system + interrupt + softirq.
                - include: system.cpu.utilization
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [ state ]
                      aggregation_type: mean
                    - action: aggregate_label_values
                      label: state
                      aggregated_values: [ user, nice ]
                      new_value: user
                      aggregation_type: sum
                    - action: aggregate_label_values
                      label: state
                      aggregated_values: [ system, interrupt, softirq ]
                      new_value: system
                      aggregation_type: sum
                - include: system.paging.operations
                  action: update
                  operations:
                    - action: aggregate_labels
                      label_set: [ direction ]
                      aggregation_type: sum
            # utilization keeps only state=used: no UI reads the other states (the Host
            # Metrics page reads free/used from system.memory.usage).
            # Kernel threads (pid 2 = kthreadd and its children). The infrastructure agent skips
            # processes with no resident memory, which "filters out certain kernel processes"
            # (process/harvester_linux.go); on the test host that set is exactly pid 2 and its children.
            # OTel semconv and the process scraper have no kernel-thread rule.
            filter/exclude_kernel_threads:
              metrics:
                datapoint:
                  - 'resource.attributes["process.pid"] == 2 or resource.attributes["process.parent_pid"] == 2'
            filter/exclude_memory_utilization:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.utilization" and attributes["state"] != "used"'
            filter/exclude_memory_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "slab_unreclaimable"'
                  - 'metric.name == "system.memory.usage" and attributes["state"] == "inactive"'
            filter/exclude_filesystem_usage:
              metrics:
                datapoint:
                  - 'metric.name == "system.filesystem.usage" and attributes["state"] == "reserved"'
                  - 'metric.name == "system.filesystem.inodes.usage" and attributes["state"] == "reserved"'
            filter/exclude_system_paging:
              metrics:
                datapoint:
                  - 'metric.name == "system.paging.usage" and attributes["state"] == "cached"'
                  - 'metric.name == "system.paging.operations" and attributes["type"] == "cached"'
            attributes/exclude_system_paging:
              include:
                match_type: strict
                metric_names:
                  - system.paging.operations
              actions:
                - key: type
                  action: delete
            # process.paging.faults: rename the fault-type attribute `type` to the semconv name
            # system.paging.fault.type (major/minor), the name the eBPF agent sent. The scraper's own
            # semconv form (process.paging.faults@v1) needs the alpha feature gate
            # scraper.process.EmitV1SystemConventions, which also switches process.cpu.utilization to
            # cpu.mode (the New Relic UI reads state) and adds process.thread.count.
            transform/host_paging_fault_type:
              error_mode: ignore
              metric_statements:
                - context: datapoint
                  statements:
                    - set(datapoint.attributes["system.paging.fault.type"], datapoint.attributes["type"]) where metric.name == "process.paging.faults"
                    - delete_key(datapoint.attributes, "type") where metric.name == "process.paging.faults"
            cumulative_to_delta:
            # A process with no page faults in the interval sends nothing, as the eBPF agent
            # did. Must run after cumulative_to_delta.
            filter/drop_zero_page_faults:
              metrics:
                datapoint:
                  - 'metric.name == "process.paging.faults" and value_int == 0'
            transform/host:
              metric_statements:
                - context: metric
                  statements:
                    - set(metric.description, "")
                    - set(metric.unit, "")
            memory_limiter:
              check_interval: 1s
              limit_mib: ${env:NEW_RELIC_MEMORY_LIMIT_MIB:-100}
            batch:
            resource_detection:
              detectors: ["system"]
              system:
                hostname_sources: ["os"]
                resource_attributes:
                  host.id:
                    enabled: true
            # Cloud instance id wins for host.id. host.name stays the OS hostname (the
            # infrastructure agent's hostname and the eBPF agent's host.name) instead of
            # e.g. the EC2 private DNS name.
            resource_detection/cloud:
              detectors: ["gcp", "ec2", "azure"]
              timeout: 2s
              override: true
              ec2:
                resource_attributes:
                  host.name:
                    enabled: false
              gcp:
                resource_attributes:
                  host.name:
                    enabled: false
              azure:
                resource_attributes:
                  host.name:
                    enabled: false
            resource_detection/env:
              detectors: ["env"]
              timeout: 2s
              override: true

          exporters:
            otlphttp:
              endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT:-https://otlp.nr-data.net}
              headers:
                api-key: ${env:NEW_RELIC_LICENSE_KEY}

          service:
            extensions: [health_check]
            pipelines:
              metrics/host:
                receivers: [host_metrics]
                processors:
                  - memory_limiter
                  - filter/exclude_kernel_threads
                  - metrics_transform
                  - filter/exclude_memory_utilization
                  - filter/exclude_memory_usage
                  - filter/exclude_filesystem_usage
                  - filter/exclude_system_paging
                  - attributes/exclude_system_paging
                  - transform/host_paging_fault_type
                  - transform/host
                  - resource_detection
                  - resource_detection/cloud
                  - resource_detection/env
                  - cumulative_to_delta
                  - filter/drop_zero_page_faults
                  - batch
                exporters: [otlphttp]
          YAML
          chmod 644 "$EBPF_CONFIG"
          echo "Wrote eBPF-infra collector config to ${EBPF_CONFIG}"

    configure_env:
      cmds:
        - |
          COLLECTOR_DISTRO="nrdot-collector"
          CONFIG_DIR="/etc/${COLLECTOR_DISTRO}"
          CONFIG_FILE="${CONFIG_DIR}/${COLLECTOR_DISTRO}.conf"

          mkdir -p "$CONFIG_DIR"

          if grep -q "^NEW_RELIC_LICENSE_KEY=" "$CONFIG_FILE" 2>/dev/null; then
            sed -i "s|^NEW_RELIC_LICENSE_KEY=.*|NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}|" "$CONFIG_FILE"
          else
            echo "NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}" | tee -a "$CONFIG_FILE" > /dev/null
          fi

          if [ "${NEW_RELIC_REGION}" = "staging" ]; then
            OTLP_ENDPOINT="https://staging-otlp.nr-data.net"
          elif [ "${NEW_RELIC_REGION}" = "EU" ]; then
            OTLP_ENDPOINT="https://otlp.eu01.nr-data.net"
          elif [ "${NEW_RELIC_REGION}" = "JP" ]; then
            OTLP_ENDPOINT="https://otlp.jp.nr-data.net"
          else
            OTLP_ENDPOINT="https://otlp.nr-data.net"
          fi

          if grep -q "^OTEL_EXPORTER_OTLP_ENDPOINT=" "$CONFIG_FILE" 2>/dev/null; then
            sed -i "s|^OTEL_EXPORTER_OTLP_ENDPOINT=.*|OTEL_EXPORTER_OTLP_ENDPOINT=${OTLP_ENDPOINT}|" "$CONFIG_FILE"
          else
            echo "OTEL_EXPORTER_OTLP_ENDPOINT=${OTLP_ENDPOINT}" | tee -a "$CONFIG_FILE" > /dev/null
          fi

          chmod 600 "$CONFIG_FILE"
          echo "Configuration written to ${CONFIG_FILE}"

    # Point OTELCOL_OPTIONS at our eBPF-infra config INSTEAD of the stock
    # config.yaml: drop the stock default (it carries file_log), keep any OHI
    # --config= fragments, and add our config exactly once. The stock package
    # ships the .conf already pointing at config.yaml, so we MUST strip it -
    # otherwise the collector loads both and file_log stays active.
    ensure_ebpf_config:
      cmds:
        - |
          CONFIG_FILE="/etc/nrdot-collector/nrdot-collector.conf"
          EBPF_CONFIG="/etc/nrdot-collector/ebpf-infra-config.yaml"
          STOCK_CONFIG="/etc/nrdot-collector/config.yaml"

          if [ ! -f "$EBPF_CONFIG" ]; then
            echo "WARNING: ${EBPF_CONFIG} not found - config was not written." >&2
            exit 1
          fi

          EXISTING_OPTIONS=$(grep "^OTELCOL_OPTIONS=" "$CONFIG_FILE" 2>/dev/null | sed 's/^OTELCOL_OPTIONS=//' | tr -d '"')

          # Remove the stock config and any prior copy of our config, collapse
          # whitespace, then re-add ours once. Keeps OHI --config fragments intact.
          CLEANED=$(printf '%s' "$EXISTING_OPTIONS" \
            | sed "s#--config=${STOCK_CONFIG}##g; s#--config=${EBPF_CONFIG}##g" \
            | tr -s ' ')
          CLEANED=$(printf '%s' "$CLEANED" | sed 's/^ *//; s/ *$//')

          if [ -z "$CLEANED" ]; then
            OTELCOL_OPTIONS="--config=${EBPF_CONFIG}"
          else
            OTELCOL_OPTIONS="${CLEANED} --config=${EBPF_CONFIG}"
          fi

          if grep -q "^OTELCOL_OPTIONS=" "$CONFIG_FILE" 2>/dev/null; then
            sed -i "s|^OTELCOL_OPTIONS=.*|OTELCOL_OPTIONS=\"${OTELCOL_OPTIONS}\"|" "$CONFIG_FILE"
          else
            echo "OTELCOL_OPTIONS=\"${OTELCOL_OPTIONS}\"" | tee -a "$CONFIG_FILE" > /dev/null
          fi

          echo "OTELCOL_OPTIONS set: ${OTELCOL_OPTIONS}"

    # The stock package postinstall autostarts the collector on the stock config
    # during install (a brief window). Measured on Ubuntu 22.04 / collector 2.5.0:
    # the stock config was live ~92ms before this task restarts it, and the file_log
    # receiver does not reach its first poll until ~323ms after start (start_at:end,
    # so no backfill; most /var/log targets are permission-denied to the unprivileged
    # collector user anyway) - effectively nothing is emitted in the window. Masking
    # the unit to suppress the autostart is NOT viable: the stock postinstall's failed
    # enable/start on a masked unit becomes its exit code and fails the package install
    # (verified - dpkg reported the package failed). Phase 2 (owning the distribution)
    # is what removes the window at the source.
    start_collector:
      cmds:
        - |
          COLLECTOR_DISTRO="nrdot-collector"
          systemctl daemon-reload
          if systemctl is-active --quiet "${COLLECTOR_DISTRO}.service" 2>/dev/null; then
            echo "${COLLECTOR_DISTRO} is running. Restarting to apply eBPF-infra config..."
            systemctl restart "${COLLECTOR_DISTRO}.service"
          else
            echo "${COLLECTOR_DISTRO} is not running. Enabling and starting..."
            systemctl enable "${COLLECTOR_DISTRO}.service"
            systemctl start "${COLLECTOR_DISTRO}.service"
          fi
          echo "${COLLECTOR_DISTRO} service started and enabled."

    assert_collector_status_ok:
      cmds:
        - |
          COLLECTOR_DISTRO="nrdot-collector"
          MAX_RETRIES=30
          TRIES=0
          echo "Waiting for ${COLLECTOR_DISTRO} to start..."
          while [ $TRIES -lt $MAX_RETRIES ]; do
            TRIES=$((TRIES + 1))
            if systemctl is-active --quiet "${COLLECTOR_DISTRO}.service"; then
              echo "${COLLECTOR_DISTRO} is running."
              exit 0
            fi
            sleep 2
          done

          echo "${COLLECTOR_DISTRO} has not started after installation." >&2
          if [ "{{.IS_SYSTEMCTL}}" -gt 0 ]; then
            journalctl -u "${COLLECTOR_DISTRO}.service" --no-pager --lines=20
          fi
          exit 31

postInstall:
  info: |2
      eBPF-infra collector config: /etc/nrdot-collector/ebpf-infra-config.yaml
      Env config:                  /etc/nrdot-collector/nrdot-collector.conf
      Service status:              systemctl status nrdot-collector
      Docs:                        https://docs.newrelic.com/docs/opentelemetry/nrdot/
